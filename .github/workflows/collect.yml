name: Collect official notices
on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm run collect
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      - run: npm run check
      - name: Commit verified data change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/live.json
          git diff --cached --quiet || git commit -m "$(TZ=Asia/Seoul date +%Y%m%d)_public_data 공식 분양공고 갱신"
          git push
